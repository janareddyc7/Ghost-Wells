name: Checks

on:
  push:
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check

  survey:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements-dataset.txt
      - run: python -m unittest discover -s tests
      - run: python -m ghostwells survey --input examples/sheets.csv --output reports/survey.json
      - run: python -m ghostwells survey --input evidence/survey_inventory.csv --output reports/pilot-survey.json
